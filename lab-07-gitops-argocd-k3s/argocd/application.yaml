apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: devops-gitops-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/moyagoub/local-ai-devops-workstation.git
    targetRevision: HEAD
    path: lab-07-gitops-argocd-k3s/apps/devops-gitops-api
  destination:
    server: https://default.svc
    namespace: gitops-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
